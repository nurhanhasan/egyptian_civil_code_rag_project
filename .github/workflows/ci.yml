name: CI

on:
  push:
  pull_request:

# prevents duplicate CI runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Unit tests
        continue-on-error: true
        run: uv run pytest tests/unit -q

      # Exit code 5 = "no tests collected"; tolerate it while tests/integration/ is empty.
      - name: Integration tests
        continue-on-error: true
        run: uv run pytest tests/integration -q || true

  rebuild-index:
    name: Rebuild index
    runs-on: ubuntu-latest
    needs: test
    environment: dev
    env:
      AWS_REGION: us-east-1
      ENVIRONMENT: dev
      BGE_DEVICE: cpu
      # # Override the container paths in .env.example with runner-local paths.
      # HF_HOME: ${{ runner.temp }}/huggingface
      # TRANSFORMERS_CACHE: ${{ runner.temp }}/huggingface/hub
      # HF_HUB_CACHE: ${{ runner.temp }}/huggingface/hub
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13"
          enable-cache: true

      # - name: Cache Hugging Face models
      #   uses: actions/cache@v4
      #   with:
      #     path: ${{ runner.temp }}/huggingface
      #     key: hf-bge-m3-${{ runner.os }}-${{ hashFiles('params.yaml') }}
      #     restore-keys: |
      #       hf-bge-m3-${{ runner.os }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: uv sync --frozen

      # - run: uv run aws sts get-caller-identity   # sanity check
      - name: Pull corpus (DVC)
        run: uv run dvc pull

      - name: Extract and chunk corpus (DVC)
        run: uv run dvc repro

      - name: Push processed corpus (DVC)
        run: uv run dvc push

      - name: Ingest corpus into the local Qdrant store
        run: |
          # QdrantLocal (no server) — serves RETRIEVER_BACKEND=qdrant
          rm -rf qdrant_storage
          cp .env.example .env.dev
          uv run python -m ragapp.scripts.qdrant_ingest_corpus \
            --qdrant-path qdrant_storage --verify
          rm -f qdrant_storage/.lock

      - name: Build the BGE index
        run: |
          # Same chunks, same embedder, different store — serves
          # RETRIEVER_BACKEND=bge (the canary arm). Reuses the HF cache warmed
          # by the ingestion step above, so this is a second embedding pass,
          # not a second model download.
          rm -rf bge_storage
          uv run python -m ragapp.scripts.bge_ingest_corpus \
            --chunks-path data/corpus/processed/chunks.article_aware.jsonl \
            --out-dir bge_storage

      - name: Verify both index artifacts
        run: |
          test -f qdrant_storage/meta.json
          test -f bge_storage/manifest.json

      - name: Upload Qdrant index
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-index
          path: qdrant_storage
          retention-days: 2
          if-no-files-found: error

      - name: Upload BGE index
        uses: actions/upload-artifact@v4
        with:
          name: bge-index
          path: bge_storage
          retention-days: 2
          if-no-files-found: error

  build:
    name: Build (docker)
    runs-on: ubuntu-latest
    needs: [test, rebuild-index]
    environment: dev
    steps:
      - uses: actions/checkout@v4


      - name: Remove checked-out indexes
        run: rm -rf qdrant_storage bge_storage

      - name: Download Qdrant index
        uses: actions/download-artifact@v4
        with:
          name: qdrant-index
          path: qdrant_storage

      - name: Download BGE index
        uses: actions/download-artifact@v4
        with:
          name: bge-index
          path: bge_storage

      # Both artifacts are baked into the one image.
      - name: Verify index artifacts
        run: |
          test -f qdrant_storage/meta.json
          test -f bge_storage/manifest.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=api \
            --cache-to type=gha,mode=max,scope=api \
            --build-arg WORKERS=1 \
            --push \
            -f docker/Dockerfile \
            --target api \
            -t nurhanhasan/ecc-rag-api:sha-${GITHUB_SHA::12} \
            -t nurhanhasan/ecc-rag-api:latest \
            .
