name: CI

on:
  push:
  pull_request:

# prevents duplicate CI runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Unit tests
        continue-on-error: true
        run: uv run pytest tests/unit -q

      # Exit code 5 = "no tests collected"; tolerate it while tests/integration/ is empty.
      - name: Integration tests
        continue-on-error: true
        run: uv run pytest tests/integration -q || true

  rebuild-index:
    name: Rebuild index
    runs-on: ubuntu-latest
    needs: test
    environment: dev
    env:
      AWS_REGION: us-east-1
      ENVIRONMENT: dev
      BGE_DEVICE: cpu
      # # Override the container paths in .env.example with runner-local paths.
      # HF_HOME: ${{ runner.temp }}/huggingface
      # TRANSFORMERS_CACHE: ${{ runner.temp }}/huggingface/hub
      # HF_HUB_CACHE: ${{ runner.temp }}/huggingface/hub
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13"
          enable-cache: true

      # - name: Cache Hugging Face models
      #   uses: actions/cache@v4
      #   with:
      #     path: ${{ runner.temp }}/huggingface
      #     key: hf-bge-m3-${{ runner.os }}-${{ hashFiles('params.yaml') }}
      #     restore-keys: |
      #       hf-bge-m3-${{ runner.os }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: uv sync --frozen

      # - run: uv run aws sts get-caller-identity   # sanity check
      - name: Pull corpus (DVC)
        run: uv run dvc pull

      - name: Extract and chunk corpus (DVC)
        run: uv run dvc repro

      - name: Push processed corpus (DVC)
        run: uv run dvc push

      - name: Start Qdrant on the build volume
        run: |
          # Start from a clean volume so the artifact contains only this build.
          rm -rf qdrant_storage
          mkdir -p qdrant_storage
          docker run -d --name qdrant-index \
            -p 6333:6333 \
            -v "$PWD/qdrant_storage:/qdrant/storage" \
            qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs qdrant-index
          exit 1

      - name: Ingest corpus into Qdrant
        run: |
          cp .env.example .env.dev
          uv run python -m ragapp.scripts.ingest_corpus --verify

      - name: Stop Qdrant (flush WAL to disk)
        run: docker stop qdrant-index

      - name: Verify index artifact
        run: |
          test -f qdrant_storage/aliases/data.json
          cat qdrant_storage/aliases/data.json
          du -sh qdrant_storage

      - name: Upload Qdrant index
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-index
          path: qdrant_storage
          retention-days: 2
          if-no-files-found: error

  build:
    name: Build (docker)
    runs-on: ubuntu-latest
    needs: [test, rebuild-index]
    environment: dev
    steps:
      - uses: actions/checkout@v4


      - name: Remove checked-out index
        run: rm -rf qdrant_storage

      - name: Download Qdrant index
        uses: actions/download-artifact@v4
        with:
          name: qdrant-index
          path: qdrant_storage

      - name: Verify index artifact
        run: test -f qdrant_storage/aliases/data.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg WORKERS=1 \
            --push \
            -f docker/Dockerfile \
            -t nurhanhasan/ecc-rag-api:sha-${GITHUB_SHA::12} \
            -t nurhanhasan/ecc-rag-api:latest \
            .
