name: egyptian-civil-code-rag

services:

  # ---------------------------------------------------------------- Dependencies

  redis:
    image: redis:${REDIS_VERSION:-7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2}
    networks:
      - appnet
    # appendonly off + snapshotting off (`--save ""`): this Redis is a
    # cache/broker/rate-limit store, not a system of record. Disabling RDB
    # background saves removes the fork() that triggers the "Memory overcommit
    # must be enabled" warning; no host sysctl change is required.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    # sysctls:
    #   - vm.overcommit_memory=1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ----------------------------------------------------------------

  qdrant:
    image: ${QDRANT_IMAGE_VERSION:-qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad}
    networks:
      - appnet
    volumes:
      - ./qdrant_storage:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped


  # ---------------------------------------------------------------- Generator

  # Private vLLM server (ADR-0003, ADR-0013). GPU profile only — never started
  # by the default stack, and its port is never published (ADR-0001). Enable:
  #   docker compose --profile gpu up -d
  # Pin the image by digest in production; VLLM_IMAGE overrides the tag.
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0}
    profiles:
      - gpu
    networks:
      - appnet
    gpus: all
    expose:
      - "8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      # 1 = never touch the network; use the mounted cache only.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
    volumes:
      # Reuse the host HF cache so models are not re-downloaded.
      - ${HF_HUB_DIR:-$HOME/.cache/huggingface/hub}:/root/.cache/huggingface/hub
    command: >
      ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-local-llm}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --host 0.0.0.0
      --port 8000
    healthcheck:
      # vLLM exposes /health; a 7B model load takes tens of seconds, so
      # start_period must cover the load (ADR-0013).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    restart: unless-stopped
    # vLLM reserves GPU memory itself via --gpu-memory-utilization; it does NOT
    # need a host RAM cap. Shared memory is required for its multiprocessing /
    # NCCL buffers (the 64MB default is too small).
    shm_size: 2g


  # CPU-only vLLM (no GPU). For laptops/CI without an NVIDIA runtime.
  #   docker compose --profile cpu up -d
  # AWQ kernels are GPU-only, so this serves the unquantized model. It advertises
  # the network alias `vllm` so rag-api uses the same URL as the GPU profile.
  # Do NOT enable the `gpu` and `cpu` profiles together (both claim alias `vllm`).
  vllm-cpu:
    image: ${VLLM_CPU_IMAGE:-vllm/vllm-openai-cpu:v0.31.0}
    profiles:
      - cpu
    networks:
     appnet:
        aliases:
          - vllm
    expose:
      - "8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      # 1 = never touch the network; use the mounted cache only.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      # CPU KV-cache budget (GiB); tune to available RAM.
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-2}
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
    volumes:
      # Reuse the host HF cache so models are not re-downloaded.
      - ${HF_HUB_DIR:-$HOME/.cache/huggingface/hub}:/root/.cache/huggingface/hub
    command: >
      ${VLLM_CPU_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-local-llm}
      --max-model-len ${VLLM_CPU_MAX_MODEL_LEN:-4096}
      --enforce-eager
      --enable-prefix-caching
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 180s
    restart: unless-stopped
    shm_size: 2g
    # CPU budget: unquantized Qwen2.5-3B weights (~6.5GB bf16) + KV cache
    # (VLLM_CPU_KVCACHE_SPACE, default 4GB) + runtime overhead. 8GB was below
    # what the model itself needs, so it OOM-killed on load.
    deploy:
      resources:
        limits:
          memory: 20G
        reservations:
          memory: 10G

  # ----------------------------------------------------------------

  rag-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${RAG_API_IMAGE:-ecc/backend:dev}
    networks:
      - appnet
    env_file:
      - .env.dev
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND_URL: ${CELERY_RESULT_BACKEND_URL:-redis://redis:6379/2}
      REDIS_RATELIMIT_URL: ${REDIS_RATELIMIT_URL:-redis://redis:6379/3}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-ragapp:cache}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # Generator: point at the private vLLM service (gpu profile). For an
      # external OpenAI-compatible API set OPENAI_BASE_URL, or GENERATOR_BACKEND=fake.
      GENERATOR_BACKEND: ${GENERATOR_BACKEND:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://vllm:8000/v1}
      # Must match the vLLM `--served-model-name` (profile-independent alias).
      GENERATOR_MODEL: ${GENERATOR_MODEL:-local-llm}
      WORKERS: ${WORKERS:-1}
      # HF Cache configuration
      HF_HOME: /home/app/.cache/huggingface
      TRANSFORMERS_CACHE: /home/app/.cache/huggingface/hub
      HF_CACHE_PATH: /home/app/.cache/huggingface/hub
      # Expermental tracking & Evaluation
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    volumes:
      - ${HF_HUB_DIR:-$HOME/.cache/huggingface/hub}:/home/app/.cache/huggingface/hub
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # Optional: only present under the gpu profile. `required: false` keeps
      # the default GPU-free stack startable without vllm (ADR-0013).
      # vllm:
      #   condition: service_healthy
      #   required: false
      # Optional: only present under the cpu profile (same alias `vllm`).
      vllm-cpu:
        condition: service_healthy
        required: false
    ports:
      - "${RAG_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Host RAM: BGE-M3 + BGE reranker. On CPU (BGE_DEVICE=cpu) they load in
    # fp32 — roughly 2x the fp16 footprint — plus torch/FastAPI overhead, so
    # the cap accounts for the CPU path, not just GPU.
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G

  # ---------------------------------------------------------------- Evaluation

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0@sha256:78803b7afd156eced665b023554bc199a4723d4466e7cba3732f7284f3cddd11
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow/mlflow_data:/mlflow
      - ./mlflow/mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/mlflow.db}
      --artifacts-destination ${MLFLOW_ARTIFACT_ROOT:-/mlflow/artifacts}
    profiles:
      - evaluation


networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
  qdrant-data: