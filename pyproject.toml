[project]
name = "egyptian-civil-code-rag-project"
version = "0.1.0"
description = "A Retrieval-Augmented Generation (RAG) system that answers questions about the Egyptian Civil Code for non-commercial educational use."
readme = "README.md"
authors = [
    { name = "nurhanhasan", email = "hasan.nurhan@hotmail.com" }
]
requires-python = ">=3.12.13"
dependencies = [
    "bentoml>=1.4.39",
    "dvc>=3.67.1",
    "fastapi>=0.142.2",
    "openai>=1.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "redis>=8.1.0",
    "torch>=2.14.1",
    "transformers<5",
    "uvicorn>=0.54.0",
]

[project.scripts]
egyptian-civil-code-rag-project = "ragapp:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ragapp"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff",
]


# uv run ruff check .
# uv run ruff format .

[tool.ruff]
line-length = 88
# data/ holds one-off corpus scratch scripts, not application code.
extend-exclude = ["data"]

# `E`: pycodestyle errors: whitespace/style problems
# `F`: Pyflakes: undefined variables, unused imports, etc.
# `I`: isort: import ordering
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
